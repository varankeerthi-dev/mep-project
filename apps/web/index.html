<!doctype html>
<html lang="en">
  <head>
    <!-- React Scan (dev-only): helps spot unnecessary re-renders / slow components -->
    <script type="module">
      if (import.meta.env.DEV) {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/react-scan@0.5.7/dist/auto.global.js';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is served from here, and only here. Do not also add it to index.css.
         The self-hosted @fontsource-variable/inter is currently inert in production
         builds: its ./files/*.woff2 assets are referenced by the emitted CSS but
         never written to dist, so every request 404s into the SPA fallback. Keep
         this tag until that emission is fixed, then switch to self-hosting and
         drop this line. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>mep-project</title>
    <style>
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

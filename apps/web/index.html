<!doctype html>
<html lang="en">
  <head>
    <!-- React Scan (dev-only): helps spot unnecessary re-renders / slow components -->
    <script type="module">
      if (import.meta.env.DEV) {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/react-scan@0.5.7/dist/auto.global.js';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is self-hosted and imported from src/main.tsx. Do not add a Google
         Fonts stylesheet or @import for Inter here or in index.css: --font-sans
         resolves to "Inter Variable", which now loads from /assets, so a second
         source is fetched on every cold load and never used. The preconnect hints
         above stay for the components that still pull Roboto, Manrope and
         Space Grotesk lazily from their own <style> blocks. -->
    <title>mep-project</title>
    <style>
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
